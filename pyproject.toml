[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightshift"
description = "Autonomous local coding-loop daemon — you slice the work, your machine ships it overnight."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aakaash Kapoor" }]
keywords = ["claude", "agents", "automation", "coding-agent", "worktrees"]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/aakaashkapoor/nightshift"
Repository = "https://github.com/aakaashkapoor/nightshift"

[project.scripts]
nsh = "nightshift.cli:app"
nightshift = "nightshift.cli:app"

[tool.hatch.version]
path = "src/nightshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nightshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
]
ignore = [
    "E501",     # line length handled by the formatter
    "B008",     # Typer uses function calls in argument defaults by design
]

[tool.mypy]
python_version = "3.11"
files = ["src/nightshift"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_unreachable = true

[tool.coverage.run]
source = ["nightshift"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    ": \\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]
